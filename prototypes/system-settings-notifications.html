<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer 系统设置与消息通知原型</title>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",Arial,sans-serif;color:#202b3a;background:#f3f6fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.topbar{height:62px;background:#fff;border-bottom:1px solid #e4eaf1;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{display:flex;gap:11px;align-items:center;font-weight:700}.logo{width:32px;height:32px;background:#1559aa;border-radius:9px;color:white;display:grid;place-items:center}.badge{font-size:11px;background:#f0f4fa;color:#617087;border-radius:99px;padding:6px 9px}.layout{max-width:1280px;margin:28px auto;padding:0 22px}.page-head{display:flex;align-items:end;justify-content:space-between;margin:0 0 18px}.page-head h1{font-size:22px;margin:0 0 5px}.page-head p{font-size:13px;color:#7b8797;margin:0}.primary-tabs{display:flex;gap:6px;border-bottom:1px solid #dfe6ef;margin-bottom:16px}.primary-tabs button{border:0;background:transparent;color:#65748a;padding:12px 16px;font-size:14px;cursor:pointer;border-bottom:2px solid transparent}.primary-tabs button.active{color:#175bad;font-weight:700;border-color:#175bad}.settings-shell{min-height:660px;background:#fff;border:1px solid #e3e9f0;border-radius:12px;display:grid;grid-template-columns:215px 1fr;overflow:hidden;box-shadow:0 5px 18px rgba(22,38,66,.035)}.sidenav{background:#fafbfd;border-right:1px solid #e7ecf2;padding:20px 12px}.sidenav h2{font-size:12px;color:#8692a3;letter-spacing:.05em;margin:0 9px 10px}.section-btn{width:100%;text-align:left;border:0;background:transparent;color:#526176;border-radius:7px;padding:11px 10px;margin:2px 0;font-size:13px;cursor:pointer}.section-btn.active{background:#eaf2fd;color:#1559aa;font-weight:700}.main{display:flex;flex-direction:column;min-width:0}.main-head{padding:22px 26px 15px;border-bottom:1px solid #eef1f5;display:flex;justify-content:space-between;align-items:center;gap:15px}.main-head h2{font-size:17px;margin:0}.main-head p{font-size:12px;color:#818d9c;margin:6px 0 0}.scroll{flex:1;padding:20px 26px 24px;max-height:590px;overflow:auto}.group{border:1px solid #e8edf3;border-radius:9px;margin:0 0 15px;overflow:hidden}.group-title{margin:0;background:#f9fafc;padding:11px 14px;font-size:13px;color:#455368;border-bottom:1px solid #edf0f4}.setting-row{display:grid;grid-template-columns:minmax(190px,1.1fr) minmax(210px,1fr) minmax(180px,1.1fr);gap:16px;align-items:center;min-height:54px;padding:10px 14px;border-bottom:1px solid #eff2f6}.setting-row:last-child{border-bottom:0}.setting-name{font-size:13px;color:#344256}.setting-help{font-size:11px;color:#8994a3;line-height:1.5}.control{display:flex;align-items:center;gap:9px}.toggle{appearance:none;width:35px;height:19px;border-radius:12px;background:#ccd4df;position:relative;cursor:pointer;flex:none;transition:.15s}.toggle:before{content:"";position:absolute;width:15px;height:15px;top:2px;left:2px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #718096;transition:.15s}.toggle:checked{background:#2c75c9}.toggle:checked:before{left:18px}.toggle:disabled,select:disabled,button:disabled{opacity:.48;cursor:not-allowed}.select{height:34px;border:1px solid #d7dfe9;border-radius:6px;background:#fff;padding:0 9px;color:#344256;font-size:12px;min-width:170px}.small-btn,.btn{border:1px solid #d4dce7;background:#fff;border-radius:6px;color:#344256;padding:8px 11px;font-size:12px;cursor:pointer}.btn.primary{background:#1759ad;color:#fff;border-color:#1759ad}.btn.ghost{background:#fff}.btn:hover,.small-btn:hover{filter:brightness(.97)}.footbar{position:sticky;bottom:0;background:#fff;border-top:1px solid #e8edf3;padding:13px 26px;display:flex;align-items:center;gap:8px}.spacer{flex:1}.notice,.tip{font-size:12px;line-height:1.55;color:#5e7290;background:#f4f8fe;border:1px solid #dce9fb;border-radius:7px;padding:10px 12px;margin:0 0 15px}.tip{color:#7b6a3d;background:#fffaf0;border-color:#f0e5c7}.sound-actions{display:flex;gap:8px;align-items:center}.sound-library{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.sound-chip{font-size:11px;border-radius:99px;background:#f0f4f9;padding:6px 9px;color:#53637a}.version-card{border:1px solid #e7edf3;border-radius:9px;padding:17px;margin-bottom:12px}.version-card h3{font-size:14px;margin:0 0 10px}.version-card p{font-size:13px;color:#67758a;line-height:1.7;margin:0}.right-actions{display:flex;gap:8px}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);padding:10px 16px;background:#172538;color:#fff;font-size:13px;border-radius:7px;opacity:0;transition:.18s;pointer-events:none}.toast.show{opacity:1}.upload-label{cursor:pointer}.pending{font-size:10px;color:#906a18;background:#fff4d9;padding:4px 7px;border-radius:99px;margin-left:6px}.disabled-label{color:#9aa4b1}.side-title{font-size:11px;color:#8b97a7;margin-left:8px}.@media(max-width:850px){.layout{padding:0 10px;margin:14px auto}.settings-shell{grid-template-columns:1fr}.sidenav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid #e7ecf2;padding:8px}.sidenav h2{display:none}.section-btn{width:auto;white-space:nowrap}.setting-row{grid-template-columns:1fr;gap:8px}.scroll{padding:14px;max-height:none}.main-head,.footbar{padding-left:14px;padding-right:14px}.page-head{align-items:start;gap:10px;flex-direction:column}}
  </style>
</head>
<body data-side="Custom">
  <header class="topbar"><div class="brand"><span class="logo">C</span><span>Customer 交易终端</span></div><div class="right-actions"><span class="badge">系统设置交互原型 · 模拟配置</span><button class="btn" id="openMessages" type="button">消息中心铃铛入口</button></div></header>
  <main class="layout">
    <div class="page-head"><div><h1>系统</h1><p>按权限和端侧范围展示设置；消息、弹框与声音分别生效。</p></div><span class="badge">Customer 端</span></div>
    <nav class="primary-tabs"><button class="active" data-primary="settings">系统设置</button><button data-primary="version">版本信息</button></nav>
    <section class="settings-shell" id="settingsShell">
      <aside class="sidenav"><h2>设置分类</h2><div id="sectionNav"></div></aside>
      <div class="main"><header class="main-head"><div><h2 id="sectionTitle"></h2><p id="sectionSub"></p></div><span class="side-title" id="sideLabel"></span></header><div class="scroll" id="settingsBody"></div><footer class="footbar"><button class="btn ghost" id="restoreDefaults">恢复默认</button><span class="spacer"></span><button class="btn ghost" id="cancelSettings">取消</button><button class="btn primary" id="saveSettings">保存</button></footer></div>
    </section>
    <section class="settings-shell hidden" id="versionShell"><div class="main" style="grid-column:1/-1"><header class="main-head"><div><h2>版本信息</h2><p>版本号与免责声明沿用当前客户端展示内容。</p></div></header><div class="scroll"><div class="version-card"><h3>当前版本</h3><p>由现有客户端读取并展示。本原型不填入未经确认的版本号。</p></div><div class="version-card"><h3>免责声明</h3><p>免责声明正文沿用现有产品文本；本需求不改写免责声明内容。</p></div></div></div></section>
    <p class="notice" style="margin-top:14px">演示范围：仅前端交互，不保存到服务端。页面设置项、事件默认值、具体权限和声音文件限制待评审/技术确认；无权限项目应置灰并显示“无权限”。消息列表和详情由独立消息中心任务承载。</p>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const side=document.body.dataset.side;
    const sections=[{id:"page",name:"页面设置"},{id:"notification",name:"消息通知"},{id:"dialogs",name:"弹框设置"},{id:"sounds",name:"声音设置"}];
    const dialogEvents={Custom:["单笔成交","未完全委托","撤单失败"],Trader:["手工单成交价格校验","HT订单确认","手工单确认撤单","HT改单确认","单笔成交","未完全委托","待审批订单","子单拒单","撤单失败","触发风控线"]};
    const defaultSettings={page:{queryAllOnLogin:false,copyByCell:true},notification:{enabled:true,order:{submit:true,cancel:true,amend:true,parentReject:true,childReject:true,execution:true,activation:true,approval:true},market:{cn:true,hk:true,us:true},risk:{existing:true},system:{loginSuccess:false,newDevice:false}},dialogs:{enabled:true,items:{}},sounds:{enabled:true,items:{orderSuccess:{enabled:true,file:"默认提示音"},orderExecution:{enabled:true,file:"清脆提示音"},cancelSuccess:{enabled:false,file:"柔和提示音"}}}};
    dialogEvents[side].forEach((_,i)=>defaultSettings.dialogs.items[`event${i}`]=i<2);
    const clone=value=>JSON.parse(JSON.stringify(value));let saved=clone(defaultSettings);let draft=clone(saved);let section="page";let primary="settings";let uploaded=[];let toastTimer;
    const builtins=["默认提示音","清脆提示音","柔和提示音","强提醒音"];
    const soundEvents=[["orderSuccess","下单成功声音"],["orderExecution","订单成交声音"],["cancelSuccess","撤单成功声音"]];
    const get=(path)=>path.split(".").reduce((obj,key)=>obj?.[key],draft);
    const set=(path,value)=>{const parts=path.split(".");const key=parts.pop();const target=parts.reduce((obj,name)=>obj[name],draft);target[key]=value;};
    const escapeHtml=value=>String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
    const options=()=>[...builtins,...uploaded.map(file=>file.name)];
    function toast(message){const el=document.querySelector("#toast");el.textContent=message;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2400);}
    function toggleRow(label,path,help="",disabled=false,badge=""){return `<div class="setting-row"><div class="setting-name ${disabled?"disabled-label":""}">${label}${badge}</div><div class="control"><input class="toggle" type="checkbox" data-setting="${path}" ${get(path)?"checked":""} ${disabled?"disabled":""}><span class="small-label">${disabled?"待确认":""}</span></div><div class="setting-help">${help}</div></div>`;}
    function group(title,body){return `<section class="group"><h3 class="group-title">${title}</h3>${body}</section>`;}
    function channelIntro(text){return `<div class="notice">${text}</div>`;}
    function renderPage(){return `${channelIntro("页面设置沿用现有配置机制。本原型只展示需求明确的页面行为，不推定保存范围或默认值。")}${group("页面行为",toggleRow("登录时全量查询交易数据","page.queryAllOnLogin","是否启用由当前用户配置决定。")+toggleRow("按照单元格复制","page.copyByCell","按单元格复制数据；具体复制范围沿用现有行为。"))}`;}
    function renderNotifications(){const disabled=!draft.notification.enabled;const order=toggleRow("下单通知","notification.order.submit","沿用现有订单消息矩阵。",disabled)+toggleRow("撤单通知","notification.order.cancel","沿用现有订单消息矩阵。",disabled)+toggleRow("改单通知","notification.order.amend","沿用现有订单消息矩阵。",disabled)+toggleRow("母单拒单","notification.order.parentReject","消息需标识母单层级及可用关联信息。",disabled)+toggleRow("子单拒单","notification.order.childReject","消息需标识子单层级及可用母子单关联信息。",disabled)+toggleRow("成交通知","notification.order.execution","沿用现有订单消息矩阵。",disabled)+toggleRow("激活通知","notification.order.activation","沿用现有订单消息矩阵。",disabled)+toggleRow("审批通知","notification.order.approval","沿用现有订单消息矩阵。",disabled);const market=toggleRow("沪深休市","notification.market.cn","市场事件归入市场通知。",disabled)+toggleRow("港股休市","notification.market.hk","市场事件归入市场通知。",disabled)+toggleRow("美股休市","notification.market.us","市场事件归入市场通知。",disabled);const risk=toggleRow("现有风控事件","notification.risk.existing","按既有风控事件矩阵，不在本需求中新增事件。",disabled);const system=toggleRow("登录成功","notification.system.loginSuccess","系统通知范围待评审确认。",true,'<span class="pending">范围待评审</span>')+toggleRow("新设备登录","notification.system.newDevice","系统通知范围待评审确认。",true,'<span class="pending">范围待评审</span>');return `${channelIntro("消息通知总开关只控制消息是否生成并进入标题栏铃铛，不改变弹框或声音渠道。关闭后事件原值保留。")}${group("消息通知总开关",toggleRow("消息通知","notification.enabled","控制消息记录生成及消息中心入口。"))}${group("订单通知",order)}${group("市场通知",market)}${group("风控通知",risk)}${group("系统通知",system)}`;}
    function renderDialogs(){const disabled=!draft.dialogs.enabled;const rows=dialogEvents[side].map((name,i)=>toggleRow(name,`dialogs.items.event${i}`,"弹框渠道独立生效，不受消息/声音开关影响。",disabled)).join("");return `${channelIntro(`${side}端按适用范围显示弹框事件。关闭弹框总开关仅置灰子项并保留原值。`)}${group("弹框渠道",toggleRow("弹框总开关","dialogs.enabled","只控制弹框提醒。"))}${group(`${side}端弹框事件`,rows)}`;}
    function soundRow(key,label){const item=draft.sounds.items[key],disabled=!draft.sounds.enabled||!item.enabled;const opts=options().map(name=>`<option value="${escapeHtml(name)}" ${name===item.file?"selected":""}>${escapeHtml(name)}</option>`).join("");return `<div class="setting-row"><div class="setting-name">${label}</div><div class="control"><input class="toggle" type="checkbox" data-setting="sounds.items.${key}.enabled" ${item.enabled?"checked":""} ${!draft.sounds.enabled?"disabled":""}><select class="select" data-sound-file="${key}" ${disabled?"disabled":""}>${opts}</select><button class="small-btn" type="button" data-event-preview="${key}" ${disabled?"disabled":""}>试听</button></div><div class="setting-help">事件开关、声音文件和试听单独设置。</div></div>`;}
    function renderSounds(){
      const disabled=!draft.sounds.enabled;
      const list=uploaded.length?`<div class="sound-library">${uploaded.map(file=>`<span class="sound-chip">${escapeHtml(file.name)}</span>`).join("")}</div>`:`<div class="sound-library"><span class="sound-chip">当前无自定义声音</span></div>`;
      const rows=soundEvents.map(([key,label])=>soundRow(key,label)).join("");
      const uploadRow=`<div class="setting-row"><div class="setting-name">统一上传声音文件</div><div class="control sound-actions"><label class="small-btn upload-label" for="soundUpload">选择本地声音</label><input id="soundUpload" type="file" accept="audio/*" hidden ${disabled?"disabled":""}><span class="setting-help">校验规则待确认；原型仅在本页暂存。</span></div><div></div></div>`;
      const libraryRow=`<div class="setting-row" style="grid-template-columns:1fr"><div><div class="setting-name">可选声音</div>${list}</div></div>`;
      const previewRow=`<div class="setting-row"><div class="setting-name">试听声音</div><div class="control"><select class="select" id="previewSound">${options().map(name=>`<option>${escapeHtml(name)}</option>`).join("")}</select><button class="btn primary" id="playPreview" type="button">▶ 试听</button></div><div class="setting-help">试听不触发业务提醒，不改变事件当前绑定；是否受声音总开关控制待确认。</div></div>`;
      return `${channelIntro("声音渠道独立生效。文件格式、大小/时长限制、保存位置、适用范围及跨设备规则待技术确认；本原型不上传到服务器。")}${group("声音渠道",toggleRow("声音总开关","sounds.enabled","关闭后事件子项置灰且保留原值。"))}${group("声音事件配置",rows+uploadRow+libraryRow)}${group("独立声音试听",previewRow)}`;
    }
    function renderBody(){
      document.querySelector("#sectionTitle").textContent=sections.find(x=>x.id===section).name;
      document.querySelector("#sectionSub").textContent=section==="notification"?"只控制进入消息中心的记录。":section==="sounds"?"事件绑定与独立试听分别操作。":"更改后点击保存生效。";
      const nav=document.querySelector("#sectionNav");
      nav.innerHTML=sections.map(x=>`<button type="button" class="section-btn ${section===x.id?"active":""}" data-section="${x.id}">${x.name}</button>`).join("");
      nav.querySelectorAll("[data-section]").forEach(btn=>btn.addEventListener("click",()=>{section=btn.dataset.section;renderBody();}));
      const body=document.querySelector("#settingsBody");
      body.innerHTML=section==="page"?renderPage():section==="notification"?renderNotifications():section==="dialogs"?renderDialogs():renderSounds();
      body.querySelectorAll("[data-setting]").forEach(input=>input.addEventListener("change",()=>{set(input.dataset.setting,input.checked);renderBody();}));
      body.querySelectorAll("[data-sound-file]").forEach(select=>select.addEventListener("change",()=>{draft.sounds.items[select.dataset.soundFile].file=select.value;renderBody();}));
      body.querySelectorAll("[data-event-preview]").forEach(btn=>btn.addEventListener("click",()=>playSound(draft.sounds.items[btn.dataset.eventPreview].file)));
      body.querySelector("#soundUpload")?.addEventListener("change",event=>{const files=[...event.target.files];if(!files.length)return;const invalid=files.find(file=>!file.type.startsWith("audio/"));if(invalid){toast("文件不是浏览器可识别的音频类型；正式格式规则待确认。");event.target.value="";return;}for(const file of files){if(!uploaded.some(item=>item.name===file.name))uploaded.push({name:file.name,url:URL.createObjectURL(file)});}renderBody();toast("声音文件已加入本页演示列表；尚未上传到服务器。");});
      body.querySelector("#playPreview")?.addEventListener("click",()=>playSound(body.querySelector("#previewSound").value));
    }
    function playSound(name){const file=uploaded.find(item=>item.name===name);if(file){const audio=new Audio(file.url);audio.play().then(()=>toast(`正在试听：${name}`)).catch(()=>toast("声音文件无法播放，请检查文件后重试。"));return;}try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx){toast(`试听占位：${name}（当前浏览器不支持音频预览）`);return;}const ctx=new Ctx(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=name==="强提醒音"?880:name==="柔和提示音"?440:name==="清脆提示音"?660:550;gain.gain.value=.08;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.22);osc.onended=()=>ctx.close();toast(`正在试听内置音占位：${name}`);}catch{toast("声音预览不可用，请检查浏览器音频权限。");}}
    function render(){document.querySelector("#sideLabel").textContent=`适用端：${side}`;document.querySelector("#settingsShell").classList.toggle("hidden",primary!=="settings");document.querySelector("#versionShell").classList.toggle("hidden",primary!=="version");document.querySelector("#settingsShell .sidenav").classList.toggle("hidden",primary!=="settings");document.querySelectorAll("[data-primary]").forEach(btn=>btn.classList.toggle("active",btn.dataset.primary===primary));if(primary==="settings")renderBody();}
    document.querySelectorAll("[data-primary]").forEach(btn=>btn.addEventListener("click",()=>{primary=btn.dataset.primary;render();}));
    document.querySelector("#restoreDefaults").addEventListener("click",()=>{draft=clone(defaultSettings);renderBody();toast("已恢复为演示默认值；点击保存后才应用。");});
    document.querySelector("#cancelSettings").addEventListener("click",()=>{draft=clone(saved);renderBody();toast("已放弃未保存修改。");});
    document.querySelector("#saveSettings").addEventListener("click",()=>{saved=clone(draft);renderBody();toast("设置已保存（仅当前原型内存状态）。");});
    document.querySelector("#openMessages").addEventListener("click",()=>toast("消息中心由独立任务原型承载；当前基准未集成此入口。"));
    render();
  </script>
</body>
</html>
